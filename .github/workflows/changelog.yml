name: Changelog

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'CHANGELOG.md'

jobs:
  update-changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate changelog entries since the last release
        run: npx --yes git-cliff --config cliff.toml --unreleased --prepend CHANGELOG.md

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs(changelog): update CHANGELOG.md"
          branch: chore/update-changelog
          title: "docs(changelog): update CHANGELOG.md"
          body: Automated changelog update generated by git-cliff from commits pushed to main.
          labels: documentation
