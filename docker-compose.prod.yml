name: summit-stats

networks:
  traefik-public:
    external: true
  internal:
    driver: bridge

services:
  app:
    image: ghcr.io/marvinlerouge/summit-stats/app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - storage_data:/app/storage
      - bootstrap_cache:/app/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../shared/env/app.env
      - ../shared/env/secrets.env
    networks:
      - internal

  nginx:
    image: ghcr.io/marvinlerouge/summit-stats/nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - tile_cache:/var/cache/nginx/tiles
    depends_on:
      - app
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"

      - "traefik.http.routers.summit-stats.rule=Host(`summit-stats.marvinlerouge.dev`)"
      - "traefik.http.routers.summit-stats.entrypoints=websecure"
      - "traefik.http.routers.summit-stats.tls=true"
      - "traefik.http.routers.summit-stats.tls.certresolver=letsencrypt"
      - "traefik.http.services.summit-stats.loadbalancer.server.port=80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD come from secrets.env (Laravel reads them too)
    env_file:
      - ../shared/env/secrets.env
    networks:
      - internal
    healthcheck:
      # $$ defers expansion to the container shell, which has the env_file values
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PostgreSQL is not exposed outside the Docker network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  queue:
    image: ghcr.io/marvinlerouge/summit-stats/app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - storage_data:/app/storage
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - ../shared/env/app.env
      - ../shared/env/secrets.env
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  storage_data:
  bootstrap_cache:
  tile_cache:
